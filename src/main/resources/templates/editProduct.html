<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template1}">
<head>
    <title>Modifier un Produit</title>
</head>
<body>
    <div layout:fragment="content1">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card card-custom p-4 bg-white">
                    <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
                        <i class="bi bi-pencil-square text-primary fs-3 me-2"></i>
                        <h4 class="mb-0 fw-bold">Modifier le Produit <span class="text-muted fs-6" th:text="'(ID: ' + ${product.id} + ')'"></span></h4>
                    </div>

                    <!-- Formulaire de modification avec validation -->
                    <form th:action="@{/admin/save(page=${page}, keyword=${keyword})}" th:object="${product}" method="post">
                        
                        <!-- ID masqué du produit -->
                        <input type="hidden" th:field="*{id}">

                        <!-- Nom du produit -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nom du Produit :</label>
                            <input type="text" class="form-control" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{name}">Erreur nom</div>
                        </div>

                        <!-- Prix du produit -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Prix Unitaire (DH) :</label>
                            <div class="input-group">
                                <input type="number" step="0.01" class="form-control" th:field="*{price}"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                                <span class="input-group-text">DH</span>
                                <div class="invalid-feedback" th:errors="*{price}">Erreur prix</div>
                            </div>
                        </div>

                        <!-- Quantité en stock -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Quantité en Stock :</label>
                            <input type="number" class="form-control" th:field="*{quantity}"
                                   th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{quantity}">Erreur quantité</div>
                        </div>

                        <!-- Boutons d'action -->
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/user/index(page=${page}, keyword=${keyword})}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Annuler
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i> Mettre à jour
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
