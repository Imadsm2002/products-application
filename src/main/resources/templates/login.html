<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestion de Produits</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body>
    <div class="container p-3">
        <div class="card login-card mx-auto p-4 bg-white">
            
            <div class="text-center mb-4">
                <div class="bg-primary text-white d-inline-flex p-3 rounded-circle mb-3 shadow-sm">
                    <i class="bi bi-shield-lock-fill fs-2"></i>
                </div>
                <h4 class="fw-bold text-dark">Connexion</h4>
                <p class="text-muted small">Application JEE de Gestion de Produits</p>
            </div>

            <!-- Message d'erreur de connexion -->
            <div th:if="${param.error}" class="alert alert-danger py-2 small d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-circle-fill me-2"></i>
                <span>Identifiant ou mot de passe incorrect.</span>
            </div>

            <!-- Message après déconnexion -->
            <div th:if="${param.logout}" class="alert alert-info py-2 small d-flex align-items-center" role="alert">
                <i class="bi bi-info-circle-fill me-2"></i>
                <span>Vous avez été déconnecté avec succès.</span>
            </div>

            <!-- Formulaire de login Spring Security -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Nom d'utilisateur</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="admin ou user1" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold small">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="1234" required>
                    </div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" name="remember-me" class="form-check-input" id="rememberMe">
                    <label class="form-check-label small text-muted" for="rememberMe">Se souvenir de moi</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Se connecter
                </button>
            </form>

            <!-- Comptes de démonstration -->
            <div class="mt-4 pt-3 border-top text-muted small">
                <div class="fw-semibold mb-1 text-secondary">Comptes de test pré-configurés :</div>
                <div class="d-flex justify-content-between mb-1">
                    <span><i class="bi bi-shield-check text-success me-1"></i> Administrateur :</span>
                    <code>admin / 1234</code>
                </div>
                <div class="d-flex justify-content-between">
                    <span><i class="bi bi-person text-info me-1"></i> Utilisateur :</span>
                    <code>user1 / 1234</code>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
