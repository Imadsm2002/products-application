# Profil MySQL - Activable via --spring.profiles.active=mysql
# Assurez-vous d'avoir cree la base de donnees : CREATE DATABASE products_db;
spring.datasource.url=jdbc:mysql://localhost:3306/products_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
