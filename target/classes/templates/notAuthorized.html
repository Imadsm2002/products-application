<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template1}">
<head>
    <title>Accès Refusé</title>
</head>
<body>
    <div layout:fragment="content1">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card card-custom p-5 bg-white text-center">
                    <div class="text-danger mb-3">
                        <i class="bi bi-shield-slash-fill display-1"></i>
                    </div>
                    <h2 class="fw-bold text-danger mb-2">Erreur 403 : Accès Interdit</h2>
                    <p class="text-muted mb-4">
                        Désolé, vous n'avez pas les privilèges nécessaires (Rôle <code>ADMIN</code> requis) pour effectuer cette opération.
                    </p>
                    <div>
                        <a th:href="@{/user/index}" class="btn btn-primary">
                            <i class="bi bi-house-door me-1"></i> Retour à la liste des produits
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
